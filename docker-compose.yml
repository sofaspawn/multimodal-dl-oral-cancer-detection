services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: oral_cancer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/oral_cancer
      UPLOAD_DIR: /app/app/uploads
    volumes:
      - api_uploads:/app/app/uploads
      - api_data:/app/data

volumes:
  api_uploads:
  api_data:
  postgres_data:
