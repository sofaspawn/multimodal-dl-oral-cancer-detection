services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oral_cancer
      POSTGRES_USER: oral_cancer
      POSTGRES_PASSWORD: oral_cancer_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oral_cancer -d oral_cancer"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://oral_cancer:oral_cancer_dev@db:5432/oral_cancer
      AUTO_CREATE_TABLES: "false"
      UPLOAD_DIR: /app/app/uploads
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_uploads:/app/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  api_uploads:
