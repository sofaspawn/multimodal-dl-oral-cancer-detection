services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/oral_cancer.db
      UPLOAD_DIR: /app/app/uploads
    volumes:
      - api_uploads:/app/app/uploads
      - api_data:/app/data

volumes:
  api_uploads:
  api_data:
