databases:
  - name: oral-cancer-db
    databaseName: oral_cancer
    user: oral_cancer
    plan: free

services:
  - type: web
    name: oral-cancer-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oral-cancer-db
          property: connectionString
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: UPLOAD_DIR
        value: "/app/app/uploads"
      - key: CORS_ORIGINS
        value: '["https://YOUR_VERCEL_APP_URL.vercel.app"]' # Update this in Render dashboard later
      - key: MODEL_DOWNLOAD_URL
        sync: false # You will provide this in the Render dashboard during deployment
